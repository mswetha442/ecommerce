{% extends 'store/layouts/main.html' %}

{% block title %}
PrimeBasket | Login 
{% endblock title %}

{% block content %}

<div class="container" style="margin-top:70px; min-height:600px;">
    <div class="row">
        <div class="col-12">
            <h4 class="mb-3">Login</h4>
            <hr style="height:2px; background-color:#b8bfc2; border:none; opacity:1;">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <section class="py-4">
        <div class="row">
            <div class="col-md-6">

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter Username"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter Password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>

                </form>

                <p class="mt-3">
                    Don't have an account?
                    <a href="{% url 'register' %}">Register Now</a>
                </p>

            </div>
        </div>
    </section>
</div>

{% endblock content %}
