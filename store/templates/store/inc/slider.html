{% load static %}

<div id="carouselExampleIndicators" 
     class="carousel slide" 
     data-bs-ride="carousel"
     data-bs-interval="2000">

    <!-- Indicators -->
    <div class="carousel-indicators">

        <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="0" 
                class="active">
        </button>

        <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="1">
        </button>

        <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="2">
        </button>

        <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="3">
        </button>

        <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="4">
        </button>
         <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="5">
        </button>
         <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="6">
        </button>
         <button type="button" 
                data-bs-target="#carouselExampleIndicators" 
                data-bs-slide-to="7">
        </button>
         
        
    </div>


    <!-- Slides -->
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="{% static 'images/slider1.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Mobile">
        </div>


        <div class="carousel-item">
            <img src="{% static 'images/slider2.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Fashion">
        </div>


        <div class="carousel-item">
            <img src="{% static 'images/slider3.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Tv,Electronics&Appliances">
        </div>


        <div class="carousel-item">
            <img src="{% static 'images/slider4.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Home Decor">
        </div>


        <div class="carousel-item">
            <img src="{% static 'images/slider5.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Kitchen & Dining">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/slider6.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Furnitures">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/slider7.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Grocery & Gourmet">
        </div>
        <div class="carousel-item">
            <img src="{% static 'images/slider8.jpg' %}" 
                 class="d-block w-100 slider-img"
                 alt="Electronics">
        </div>


    </div>


    <!-- Previous Button -->
    <button class="carousel-control-prev" 
            type="button" 
            data-bs-target="#carouselExampleIndicators" 
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>


    <!-- Next Button -->
    <button class="carousel-control-next" 
            type="button" 
            data-bs-target="#carouselExampleIndicators" 
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>
