{% extends 'adminpanel/base.html' %}

{% block content %}

<div class="main-content">

    <div class="admin-navbar">
        <h3>Add Product</h3>
        <a href="{% url 'product_list' %}" class="btn-add">← Back to Products</a>
    </div>

    <div class="product-form">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Category -->
            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="">Select Category</option>

                    {% for cat in categories %}
                        <option value="{{ cat.id }}">
                            {{ cat.name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <!-- Product Name -->
            <div class="form-group">
                <label>Product Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter product name"
                    required>
            </div>

            <!-- Vendor -->
            <div class="form-group">
                <label>Vendor</label>
                <input
                    type="text"
                    name="vendor"
                    placeholder="Enter vendor name"
                    required>
            </div>

            <!-- Original Price -->
            <div class="form-group">
                <label>Original Price</label>
                <input
                    type="number"
                    step="0.01"
                    name="original_price"
                    placeholder="0.00"
                    required>
            </div>

            <!-- Selling Price -->
            <div class="form-group">
                <label>Selling Price</label>
                <input
                    type="number"
                    step="0.01"
                    name="selling_price"
                    placeholder="0.00"
                    required>
            </div>

            <!-- Quantity -->
            <div class="form-group">
                <label>Quantity</label>
                <input
                    type="number"
                    name="quantity"
                    placeholder="Enter quantity"
                    required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>
                <textarea
                    name="description"
                    rows="5"
                    placeholder="Product description"></textarea>
            </div>

            <!-- Image -->
            <div class="form-group">
                <label>Product Image</label>
                <input
                    type="file"
                    name="product_image"
                    accept="image/*">
            </div>

            <!-- Trending -->
            <div class="form-check">
                <input
                    type="checkbox"
                    name="trending"
                    id="trending">

                <label for="trending">
                    Trending Product
                </label>
            </div>

            <!-- Status -->
            <div class="form-check">
                <input
                    type="checkbox"
                    name="status"
                    id="status">

                <label for="status">
                    Hide Product
                </label>
            </div>

            <br>

            <button type="submit" class="save-btn">
                Save Product
            </button>

        </form>

    </div>

</div>

{% endblock %}
