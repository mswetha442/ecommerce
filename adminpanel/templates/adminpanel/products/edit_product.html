{% extends 'adminpanel/base.html' %}

{% block content %}

<div class="main-content">

    <div class="admin-navbar">
        <h3>Edit Product</h3>
        <a href="{% url 'product_list' %}" class="btn-add">
            Back
        </a>
    </div>

    <div class="product-form">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">
                <label>Category</label>

                <select name="category">

                    {% for cat in categories %}

                    <option value="{{ cat.id }}"
                    {% if product.category.id == cat.id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="name" value="{{ product.name }}">
            </div>

            <div class="form-group">
                <label>Vendor</label>
                <input type="text" name="vendor" value="{{ product.vendor }}">
            </div>

            <div class="form-group">
                <label>Original Price</label>
                <input type="number" name="original_price"
                       value="{{ product.original_price }}">
            </div>

            <div class="form-group">
                <label>Selling Price</label>
                <input type="number" name="selling_price"
                       value="{{ product.selling_price }}">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity"
                       value="{{ product.quantity }}">
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea name="description">{{ product.description }}</textarea>

            </div>

            <div class="form-group">

                <label>Current Image</label><br>

                {% if product.product_image %}
                    <img src="{{ product.product_image.url }}"
                         width="120">
                {% endif %}

            </div>

            <div class="form-group">

                <label>New Image</label>

                <input type="file" name="product_image">

            </div>

            <div class="form-check">

                <input type="checkbox"
                       name="trending"
                       {% if product.trending %}checked{% endif %}>

                Trending

            </div>

            <div class="form-check">

                <input type="checkbox"
                       name="status"
                       {% if product.status %}checked{% endif %}>

                Hide Product

            </div>

            <br>

            <button class="save-btn">
                Update Product
            </button>

        </form>

    </div>

</div>

{% endblock %}
