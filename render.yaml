services:
  - type: web
    name: django-ecommerce
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecommerce.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: ecommerce-db
    databaseName: ecommerce_store
    user: ecommerce_user