services:
  - type: web
    name: django-ecommerce
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecommerce.wsgi:application"

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        sync: false

      - key: WEB_CONCURRENCY
        value: "2"